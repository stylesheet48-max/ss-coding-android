name: Build SS Coding APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Android SDK 36 & Build-Tools 36.0.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies & Cordova CLI
        run: |
          npm install --prefix codemirror-lsp-client --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm install -g cordova

      - name: Run TypeScript check & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Configure Cordova Android & plugins
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: |
          node utils/storage_manager.mjs y
          npm run setup

      - name: Verify Cordova & Android SDK package ID
        run: |
          grep -n 'com.stylesheet.sscoding' config.xml package.json

      - name: Build production WebView bundle & installable APK
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          node ./utils/config.js p paid
          npx rspack --mode production --env platform=android --env mode=p
          npx cordova build android --debug
          ls -lh platforms/android/app/build/outputs/apk/debug/

      - name: Generate signing keystore & build release APK + AAB
        id: release_build
        continue-on-error: true
        run: |
          KEYSTORE_PATH="/tmp/sscoding-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -alias sscoding \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sscoding123 \
            -keypass sscoding123 \
            -dname "CN=SS Coding, OU=Mobile, O=Stylesheet, L=Bengaluru, S=KA, C=IN"

          cat > build.json <<EOF
          {
            "android": {
              "release": {
                "keystore": "$KEYSTORE_PATH",
                "storePassword": "sscoding123",
                "alias": "sscoding",
                "password": "sscoding123",
                "keystoreType": "PKCS12"
              }
            }
          }
          EOF

          npx cordova build android --release -- --packageType=apk
          npx cordova build android --release -- --packageType=bundle
          rm -f build.json "$KEYSTORE_PATH"

      - name: Collect outputs
        run: |
          mkdir -p artifacts
          cp platforms/android/app/build/outputs/apk/debug/*.apk artifacts/ss-coding-debug.apk
          if ls platforms/android/app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp platforms/android/app/build/outputs/apk/release/*.apk artifacts/ss-coding-release.apk
          fi
          if ls platforms/android/app/build/outputs/bundle/release/*.aab 1> /dev/null 2>&1; then
            cp platforms/android/app/build/outputs/bundle/release/*.aab artifacts/ss-coding-release.aab
          fi
          ls -lh artifacts/
          sha256sum artifacts/*

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ss-coding-android-builds
          path: artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.13.5-build.${{ github.run_number }}
          name: SS Coding v1.13.5 (Build ${{ github.run_number }})
          body: |
            Automated build of **SS Coding** (`com.stylesheet.sscoding`).
            - `ss-coding-debug.apk`: Production WebView bundle packaged in an installable APK.
            - `ss-coding-release.apk` / `ss-coding-release.aab` (if generated).
          files: artifacts/*
