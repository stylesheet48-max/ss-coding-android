<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background-color: #eef4fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    :root {
      --bg-color: #eef4fc;
      --ss-splash-accent: #2563eb;
      --ss-splash-text: #0f172a;
      --ss-splash-muted: #475569;
      --test-height: 45px;
    }

    body.loading {
      position: relative;
      overflow: hidden;
    }

    body.loading #splash {
      display: flex;
    }

    #splash {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      padding: 24px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background:
        radial-gradient(circle at 18% 18%, rgba(37, 99, 235, 0.16), transparent 45%),
        radial-gradient(circle at 82% 80%, rgba(14, 165, 233, 0.14), transparent 42%),
        linear-gradient(155deg, #f7faff 0%, #eaf2fc 52%, #e0ecfb 100%);
      color: var(--ss-splash-text);
      text-align: center;
      transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .splash-card {
      width: min(320px, 86vw);
      padding: 28px 24px 24px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 20px 44px rgba(15, 23, 42, 0.08),
        0 2px 10px rgba(37, 99, 235, 0.06);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: ssSplashEnter 280ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .splash-logo {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18);
    }

    .splash-title {
      margin: 4px 0 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .splash-subtitle {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ss-splash-muted);
    }

    .splash-progress {
      width: 100%;
      height: 4px;
      margin-top: 8px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.14);
      overflow: hidden;
      position: relative;
    }

    .splash-progress::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 -40%;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3b82f6, #2563eb, #0ea5e9);
      animation: ssSplashProgress 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .splash-version {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      color: var(--ss-splash-muted);
      font-size: 0.72rem;
      white-space: pre;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: left;
      opacity: 0.85;
    }

    .splash-message {
      margin-top: 4px;
      color: var(--ss-splash-muted);
      font-size: 0.82rem;
      line-height: 1.4;
      min-height: 1.2em;
      max-width: 100%;
      word-break: break-word;
    }

    .splash-retry {
      display: none;
      margin-top: 6px;
      padding: 8px 18px;
      border: 1px solid rgba(37, 99, 235, 0.28);
      border-radius: 999px;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    body[data-startup-error="1"] .splash-progress {
      display: none;
    }

    body[data-startup-error="1"] .splash-message {
      color: #b91c1c;
    }

    body[data-startup-error="1"] .splash-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes ssSplashEnter {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ssSplashProgress {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(320%);
      }
    }
  </style>

  <!-- Set theme color BEFORE UI renders -->
  <script>
    (function () {
      var MIN_WEBVIEW_MAJOR = 67;
      var color = localStorage.getItem("__primary_color");
      var bg = color || "#eef4fc";

      document.documentElement.style.setProperty("--bg-color", bg);
      document.documentElement.style.backgroundColor = bg;
      document.body && (document.body.style.backgroundColor = bg);

      function getWebViewMajor() {
        var match = navigator.userAgent.match(/(?:Chrome|CriOS)\/(\d+)/);
        return match ? Number(match[1]) : 0;
      }

      var pendingStartupMessage = "";
      var pendingStartupError = false;
      var hasPendingStartupMessageListener = false;

      function isStartupLoading() {
        return !document.body || document.body.classList.contains("loading");
      }

      function applyStartupMessage() {
        hasPendingStartupMessageListener = false;
        if (document.body && isStartupLoading()) {
          document.body.setAttribute("data-small-msg", pendingStartupMessage);
          if (pendingStartupError) {
            document.body.setAttribute("data-startup-error", "1");
          }
        }
      }

      function setStartupMessage(message, isError) {
        pendingStartupMessage = message;
        if (isError) pendingStartupError = true;

        if (document.body) {
          applyStartupMessage();
        } else if (!hasPendingStartupMessageListener) {
          hasPendingStartupMessageListener = true;
          document.addEventListener("DOMContentLoaded", applyStartupMessage, {
            once: true
          });
        }
      }

      var hasES6 = false;
      try {
        hasES6 = !!new Function("return (()=>{})")();
      } catch (e) {}

      if (!hasES6) {
        setStartupMessage(
          "SS Coding requires a modern browser. Please update Android System WebView or Chrome.",
          true
        );
      }

      window.__ACODE_WEBVIEW_MAJOR__ = getWebViewMajor();
      window.__ACODE_MIN_WEBVIEW_MAJOR__ = MIN_WEBVIEW_MAJOR;

      if (hasES6 &&
        window.__ACODE_WEBVIEW_MAJOR__ &&
        window.__ACODE_WEBVIEW_MAJOR__ < MIN_WEBVIEW_MAJOR
      ) {
        setStartupMessage(
          "Your Android System WebView is old. Update Android System WebView or Chrome if SS Coding stays on this screen.",
          true
        );
      }

      function isStorageError(reason) {
        if (!reason) return false;
        return (
          reason.name === "FileError" ||
          reason.name === "NotFoundError" ||
          reason.name === "SecurityError" ||
          (typeof window.FileError !== "undefined" &&
            reason instanceof window.FileError)
        );
      }

      function handleStartupError(event) {
        if (!isStartupLoading()) return;
        var message = event && event.message ? event.message : "Startup error";
        setStartupMessage(
          isStorageError(event && event.error)
            ? "SS Coding failed to start: storage is unavailable. Try restarting your device, or clearing app data. " +
                message
            : "SS Coding failed to start. Update Android System WebView or Chrome. " +
                message,
          true
        );
      }

      function handleStartupRejection(event) {
        if (!isStartupLoading()) return;
        var reason = event && event.reason;
        var message =
          reason && reason.message ? reason.message : "Startup promise failed";
        setStartupMessage(
          isStorageError(reason)
            ? "SS Coding failed to start: storage is unavailable. Try restarting your device, or clearing app data. " +
                message
            : "SS Coding failed to start. Update Android System WebView or Chrome. " +
                message,
          true
        );
      }

      window.addEventListener("error", handleStartupError);
      window.addEventListener("unhandledrejection", handleStartupRejection);
    })();
  </script>

  <!-- Core Scripts -->
  <script src="cordova.js"></script>

  <script src="./build/boot.js"></script>

  <title>SS Coding</title>
</head>

<body class="loading" data-version="" data-small-msg="">
  <div id="splash">
    <div class="splash-version"></div>
    <div class="splash-card">
      <img class="splash-logo" src="./logo.svg" alt="SS Coding logo" />
      <h1 class="splash-title">SS Coding</h1>
      <p class="splash-subtitle">Initializing workspace...</p>
      <div class="splash-progress" aria-hidden="true"></div>
      <div class="splash-message"></div>
      <button type="button" class="splash-retry" onclick="location.reload()">Retry</button>
    </div>
  </div>

  <wc-page id="root" class="primary"></wc-page>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const splash = document.getElementById("splash");

      function updateSplash() {
        splash.querySelector(".splash-version").textContent =
          document.body.getAttribute("data-version") || "";

        splash.querySelector(".splash-message").textContent =
          document.body.getAttribute("data-small-msg") || "";
      }

      updateSplash();

      new MutationObserver(updateSplash).observe(document.body, {
        attributes: true,
        attributeFilter: ["data-version", "data-small-msg"]
      });
    });
  </script>
</body>

</html>
